<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8"><meta name="apple-mobile-web-app-capable" content="yes">
<title>小猫快跑 · 图图和包子</title>
<link rel="stylesheet" href="style.css"><script src="app.js" defer></script>
</head>
<body>
<main>
<header><h1>小猫快跑</h1></header>
<section id="selection" aria-label="选择小猫">
<div class="pick-title"><h2>选择角色</h2></div>
<div class="cats">
<button class="cat-card selected" data-skin="tutu" aria-pressed="true"><div class="portrait"><img src="assets/tutu/head.png" alt="图图" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>🐱</span></div><b>图图</b><span class="badge">已选择</span></button>
<button class="cat-card" data-skin="baozi" aria-pressed="false"><div class="portrait"><img src="assets/baozi/head.png" alt="包子" onerror="this.hidden=true;this.nextElementSibling.hidden=false"><span hidden>🐈‍⬛</span></div><b>包子</b><span class="badge">选择</span></button>
</div>
<button id="start" class="primary" disabled>加载中…</button>
<p class="instruction keyboard">方向键 / WASD 转向 · 空格暂停 · R 重来</p>
<p class="instruction touch">滑动棋盘或点方向按钮转向</p>
<p class="rules">开局 1 个便便 · 约每 8 秒换位置 · 30 秒后最多 2 个</p>
</section>
<section id="play" hidden aria-label="游戏">
<div class="stats"><div><small>本局得分</small><strong id="score">0</strong></div><div><small>本局用时</small><strong id="time">0.0<span>秒</span></strong></div><div><small>最高纪录</small><strong id="record">暂无</strong></div></div>
<div class="board-wrap">
<canvas id="board" width="780" height="480" tabindex="0" aria-label="小猫游戏棋盘，使用方向键或滑动控制"></canvas>
<div id="overlay" hidden role="dialog" aria-modal="true" aria-labelledby="overlay-title"><div class="end-card"><span id="end-icon">🐾</span><h2 id="overlay-title">准备出发</h2><p id="overlay-detail"></p><button id="resume" class="primary">继续游戏</button><button id="again" class="primary">再来一局</button><button id="choose" class="secondary">重新选猫</button></div></div>
</div>
<div class="gamebar"><span id="hazards">💩 1 / 2</span><button id="pause">暂停</button><button id="restart">重来</button><button id="back">选猫</button></div>
<div class="dpad" aria-label="触屏方向控制"><button data-dir="0" class="up" aria-label="向上">↑</button><button data-dir="3" class="left" aria-label="向左">←</button><span>🐾</span><button data-dir="1" class="right" aria-label="向右">→</button><button data-dir="2" class="down" aria-label="向下">↓</button></div>
<p class="instruction keyboard">方向键 / WASD 转向 · 空格暂停 · R 重来</p>
</section>
<p id="notice" role="status" aria-live="polite"></p>
<footer>最高分优先，同分比谁更快 · 纪录保存在当前浏览器</footer>
</main>
</body></html>
